{% extends "base.html" %}
{% block title %}Bulk Price Update — PresyoWatch{% endblock %}
{% block content %}
<h4 class="page-title">Bulk Price Update</h4>
<form method="POST" class="pw-card">
  {% for l in listings %}
  <div class="row-line">
    <label class="fw-semibold" for="p{{ l.listing_id }}">{{ l.name }}</label>
    <input id="p{{ l.listing_id }}" class="input-pw" style="max-width:120px;padding:7px 12px" type="number" step="0.01" min="0.01"
           name="price_{{ l.listing_id }}" value="{{ l.price }}">
  </div>
  {% else %}<div class="text-muted text-center">No listings to update.</div>{% endfor %}
  {% if listings %}<button class="btn-pw btn-block mt-3" type="submit">Save All Prices</button>{% endif %}
</form>
<a class="btn-pale btn-block" href="{{ url_for('vendor.prices') }}">Cancel</a>
{% endblock %}
