{% extends "base.html" %}
{% block title %}Change Password — PresyoWatch{% endblock %}
{% block content %}
<h4 class="page-title">Change Password</h4>
<form method="POST" class="pw-card">
  <div class="field"><label class="form-label">Current password</label><input class="input-pw" type="password" name="current_password" required></div>
  <div class="field"><label class="form-label">New password</label><input class="input-pw" type="password" name="new_password" required minlength="6"></div>
  <div class="field"><label class="form-label">Confirm new password</label><input class="input-pw" type="password" name="confirm_password" required></div>
  <button class="btn-pw btn-block" type="submit">Update Password</button>
</form>
{% endblock %}
