{% extends "base.html" %}
{% block title %}{{ 'Edit' if listing else 'Add' }} Listing — PresyoWatch{% endblock %}
{% block content %}

<h4 class="page-title">{{ 'Edit Listing' if listing else 'Add Listing' }}</h4>

<form method="POST" class="pw-card" id="listingForm">

  <div class="field">
    <label class="form-label" for="category">Category</label>
    <select class="input-pw" id="category" name="category">
      <option value="">Search or select a category</option>
      {% for c in category_options %}
      <option value="{{ c.name }}" data-sub="{{ c.count }} item{{ 's' if c.count != 1 }}" {{ 'selected' if c.name == selected_category }}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label class="form-label" for="item">Item name</label>
    <select class="input-pw" id="item" name="product_choice" disabled>
      <option value="">Choose a category first</option>
    </select>
    <div class="mt-2" id="otherItem" hidden>
      <input class="input-pw" type="text" name="name" id="otherName" maxlength="100"
             value="{{ listing.name if listing and selected_item == 'new' else '' }}" placeholder="Type the item name">
    </div>
  </div>

  <div class="row g-2">
    <div class="col-7 field">
      <label class="form-label" for="price">Price</label>
      <input class="input-pw" id="price" type="number" step="0.01" min="0.01" name="price"
             value="{{ listing.price if listing else '' }}" placeholder="₱" required>
    </div>
    <div class="col-5 field">
      <label class="form-label" for="unit">Unit</label>
      <input class="input-pw" id="unit" name="unit" maxlength="20" value="{{ listing.unit if listing else 'kg' }}">
    </div>
  </div>

  <button class="btn-pw btn-block" type="submit">Save Listing</button>
</form>

<a class="btn-pale btn-block" href="{{ url_for('vendor.listings') }}">Cancel</a>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/combo.js') }}"></script>
<script>
(() => {
  const products = {{ product_options|tojson }};   // [{id, name, unit, category}]
  const category = document.getElementById('category');
  const item = document.getElementById('item');
  const other = document.getElementById('otherItem');
  const otherName = document.getElementById('otherName');
  const unit = document.getElementById('unit');
  const startItem = {{ selected_item|tojson }};

  const catBox = PWCombo.enhance(category, { icon: 'fa-layer-group' });
  const itemBox = PWCombo.enhance(item, {
    icon: 'fa-basket-shopping',
    onBlocked: () => { catBox.attention(); return 'Please choose a Category first.'; },
  });

  function fillItems(keep) {
    const list = products.filter((p) => p.category === category.value);
    item.innerHTML = '';
    item.add(new Option(category.value ? 'Search or select an item' : 'Choose a category first', '', true, true));
    list.forEach((p) => { const o = new Option(p.name, p.id); o.dataset.sub = 'per ' + p.unit; o.dataset.unit = p.unit; item.add(o); });
    if (category.value) { const o = new Option('Other item…', 'new'); o.dataset.sub = 'type it in'; item.add(o); }
    item.disabled = !category.value;
    if (keep) item.value = String(keep);
    itemBox.refresh();
    showOther();
  }

  function showOther() {
    other.hidden = item.value !== 'new';
    otherName.required = item.value === 'new';
  }

  category.addEventListener('change', () => fillItems(null));
  item.addEventListener('change', () => {
    showOther();
    if (item.value === 'new') { otherName.focus(); return; }
    const o = item.selectedOptions[0];
    if (o && o.dataset.unit) unit.value = o.dataset.unit;
  });

  document.getElementById('listingForm').addEventListener('submit', (e) => {
    if (!category.value) { e.preventDefault(); catBox.showAlert('Please choose a Category.'); catBox.attention(); }
    else if (!item.value) { e.preventDefault(); itemBox.showAlert('Please choose an item.'); itemBox.attention(); }
  });

  if (category.value) fillItems(startItem);
})();
</script>
{% endblock %}
